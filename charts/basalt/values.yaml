nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

dashboard:
  replicaCount: 2
  image:
    repository: ghcr.io/kingsokafor777-droid/basalt-dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  containerPort: 3000
  env:
    warehouseReadApiUrl: ""
    artifactBucket: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    # Basalt Dashboard currently serves the application shell at /. Override after a dedicated health route exists.
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: basalt.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

warehouse:
  enabled: false
  schedule: "17 * * * *"
  image:
    repository: ghcr.io/kingsokafor777-droid/basalt-warehouse
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command: []
  args: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

rag:
  enabled: false
  schedule: "29 * * * *"
  image:
    repository: ghcr.io/kingsokafor777-droid/basalt-rag
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command: []
  args: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  warehouseNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: basalt
