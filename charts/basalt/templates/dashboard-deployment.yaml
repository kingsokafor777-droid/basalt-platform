apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "basalt.fullname" . }}-dashboard
  labels:
    {{- include "basalt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "basalt.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "basalt.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}{{ if .Values.dashboard.image.digest }}@{{ .Values.dashboard.image.digest }}{{ else }}:{{ .Values.dashboard.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "basalt.fullname" . }}-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.dashboard.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.dashboard.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.dashboard.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.dashboard.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.probes.periodSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
