apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "basalt.fullname" . }}-runtime
  labels:
    {{- include "basalt.labels" . | nindent 4 }}
data:
  WAREHOUSE_READ_API_URL: {{ .Values.dashboard.env.warehouseReadApiUrl | quote }}
  BASALT_ARTIFACT_BUCKET: {{ .Values.dashboard.env.artifactBucket | quote }}
