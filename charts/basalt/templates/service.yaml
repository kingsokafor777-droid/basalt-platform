apiVersion: v1
kind: Service
metadata:
  name: {{ include "basalt.fullname" . }}-dashboard
  labels:
    {{- include "basalt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
