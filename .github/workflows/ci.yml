name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-platform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: azure/setup-helm@v4
        with:
          version: "3.16.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/environments/dev init -backend=false
      - run: terraform -chdir=terraform/environments/dev validate
      - run: helm lint charts/basalt
      - run: helm template basalt charts/basalt -f charts/basalt/values.yaml > /tmp/basalt.yaml
      - run: python3 scripts/validate_repo.py
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
