name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-platform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "3.16.3"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/environments/dev init -backend=false
      - run: terraform -chdir=terraform/environments/dev validate
      - run: helm lint charts/basalt
      - run: helm template basalt charts/basalt -f charts/basalt/values.yaml > /tmp/basalt.yaml
      - run: python3 scripts/validate_repo.py
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1
        with:
          reporter: github-check
          fail_level: error
