name: Provision Platform Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROVISION to authorize a Terraform apply after protected-environment review"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    if: inputs.confirm == 'PROVISION'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_PLATFORM_PROVISION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config=backend.hcl
      - run: terraform plan -out=tfplan
      - run: terraform apply tfplan
