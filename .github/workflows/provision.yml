name: Provision Platform Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROVISION to authorize a Terraform apply after protected-environment review"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    if: inputs.confirm == 'PROVISION'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLATFORM_PROVISION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config=backend.hcl
      - run: terraform plan -out=tfplan
      - run: terraform apply tfplan
