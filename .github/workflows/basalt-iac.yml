name: Basalt IaC

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/basalt-iac.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/basalt-core.git@main"
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/basalt-iac.git@main"
      - run: basalt-iac scan terraform --output results.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: basalt-platform-terraform
