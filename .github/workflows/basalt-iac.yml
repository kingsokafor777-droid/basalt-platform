name: Basalt IaC

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/basalt-iac.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/basalt-core.git@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/basalt-iac.git@7eaed364f6fc12c44d98fbe7e6bb642e940742ef"
      - run: basalt-iac scan terraform --output results.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: results.sarif
          category: basalt-platform-terraform
